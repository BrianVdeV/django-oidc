<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar Sesión</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="pt-2 pt-sm-5 pb-4 pb-sm-5 position-relative">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-xxl-4 col-lg-5">
            <div class="card">
              <!-- Logo -->
              <div class="card-header py-4 text-center bg-primary">
                <a href="https://intranet.planosperu.com.pe/" class="logo">
                  <span>Planos Perú</span>
                </a>
              </div>

              <div class="card-body p-4">
                <div class="text-center w-75 m-auto">
                  <h4 class="text-dark-50 text-center pb-0 fw-bold">Iniciar Sesión</h4>
                  <p class="text-muted mb-4">Ingrese su usuario y contraseña para acceder al panel de administración.</p>
                </div>
                <!-- Mostrar mensajes de error -->
                {% if messages %} {% for message in messages %}
                <div class="alert alert-danger" role="alert">{{ message }}</div>
                {% endfor %} {% endif %}
                <form method="POST" action="">
                  {% csrf_token %}
                  <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input class="form-control" type="text" id="username" name="username" required placeholder="Ingresa tu usuario" />
                  </div>
                  <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="input-group input-group-merge">
                      <input type="password" id="password" class="form-control" name="password" required placeholder="Ingresa tu contraseña" />
                    </div>
                  </div>
                  <div class="mb-3 mb-0 text-center">
                    <button class="btn btn-primary" type="submit">Iniciar Sesión</button>
                  </div>
                </form>
              </div>
              <!-- end card-body -->
            </div>
          </div>
          <!-- end col -->
        </div>
        <!-- end row -->
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
